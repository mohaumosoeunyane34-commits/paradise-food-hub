<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paradise Food Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            opacity: 0.8;
        }

        .location {
            text-align: center;
            padding: 12px;
            background: white;
            font-size: 14px;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .menu-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .cart {
            background: #111;
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
        }

        #menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .item {
            background: white;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .item h3 {
            margin-top: 0;
        }

        .description {
            color: #666;
            line-height: 1.5;
            min-height: 50px;
        }

        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
        }

        .price {
            font-weight: bold;
            font-size: 20px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            background: #111;
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        #cartBox {
            display: none;
            background: white;
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .cart-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .checkout-button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            font-size: 16px;
        }

        .error {
            background: #ffe5e5;
            color: #a00;
            padding: 15px;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 30px 15px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>🍽️ Paradise Food Hub</h1>
    <p>Good food. Simple ordering.</p>
</header>

<div class="location">
    📍 Ha Thamae, next to Shelly Brown, Maseru, Lesotho
</div>

<main>

    <div class="menu-title">
        <h2>Menu</h2>

        <div class="cart">
            Cart: <span id="cartCount">0</span>
        </div>
    </div>

    <div id="menu">
        Loading menu...
    </div>

    <div id="cartBox">

        <h2>Your Cart</h2>

        <div id="cartItems"></div>

        <h3>
            Total: M<span id="cartTotal">0.00</span>
        </h3>

        <button
            class="checkout-button"
            onclick="checkout()"
        >
            Proceed to Checkout
        </button>

    </div>

</main>

<footer>
    Paradise Food Hub © 2026
</footer>

<script>

let menu = [];
let cart = [];


async function loadMenu() {

    const container =
        document.getElementById("menu");

    try {

        const response =
            await fetch("/api/menu");

        if (!response.ok) {
            throw new Error(
                "Server returned " + response.status
            );
        }

        menu = await response.json();

        container.innerHTML = "";

        if (!menu.length) {
            container.innerHTML =
                "<p>No menu items available.</p>";
            return;
        }

        menu.forEach(item => {

            const card =
                document.createElement("div");

            card.className = "item";

            card.innerHTML = `
                <h3>${escapeHtml(item.name)}</h3>

                <div class="description">
                    ${escapeHtml(item.description || "")}
                </div>

                <div class="bottom">

                    <div class="price">
                        M${Number(item.price).toFixed(2)}
                    </div>

                    <button>
                        Add
                    </button>

                </div>
            `;

            card.querySelector("button")
                .addEventListener(
                    "click",
                    () => addToCart(item.id)
                );

            container.appendChild(card);
        });

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="error">
                Unable to load the menu.
                Please refresh the page.
            </div>
        `;
    }
}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function addToCart(id) {

    const item =
        menu.find(x => x.id === id);

    if (!item) {
        return;
    }

    const existing =
        cart.find(x => x.id === id);

    if (existing) {

        existing.quantity += 1;

    } else {

        cart.push({
            id: item.id,
            name: item.name,
            price: Number(item.price),
            quantity: 1
        });
    }

    updateCart();
}


function updateCart() {

    const cartItems =
        document.getElementById("cartItems");

    const cartBox =
        document.getElementById("cartBox");

    cartItems.innerHTML = "";

    let count = 0;
    let total = 0;

    cart.forEach(item => {

        count += item.quantity;

        total +=
            item.price * item.quantity;

        const row =
            document.createElement("div");

        row.className = "cart-row";

        row.innerHTML = `
            <span>
                ${escapeHtml(item.name)}
                × ${item.quantity}
            </span>

            <strong>
                M${(
                    item.price * item.quantity
                ).toFixed(2)}
            </strong>
        `;

        cartItems.appendChild(row);
    });

    document.getElementById(
        "cartCount"
    ).textContent = count;

    document.getElementById(
        "cartTotal"
    ).textContent = total.toFixed(2);

    cartBox.style.display =
        cart.length ? "block" : "none";
}


function checkout() {

    if (!cart.length) {

        alert("Your cart is empty.");

        return;
    }

    localStorage.setItem(
        "paradise_cart",
        JSON.stringify(
            cart.map(item => ({
                id: item.id,
                quantity: item.quantity
            }))
        )
    );

    window.location.href =
        "/checkout";
}


loadMenu();

</script>

</body>
</html>
