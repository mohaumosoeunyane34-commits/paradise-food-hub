<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paradise Food Hub</title>

    <style>
        :root {
            --c34-black: #0b0f0d;
            --c34-dark: #121815;
            --c34-green: #1f7a4d;
            --c34-green-light: #35a866;
            --c34-orange: #f28c28;
            --c34-cream: #fffaf0;
            --c34-text: #202522;
            --c34-muted: #68736d;
            --c34-white: #ffffff;
            --c34-border: #e7dfd0;
            --c34-shadow: 0 14px 35px rgba(11, 15, 13, 0.10);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top right, rgba(242,140,40,0.10), transparent 30%),
                linear-gradient(180deg, #fffdf8 0%, var(--c34-cream) 100%);
            color: var(--c34-text);
        }

        header {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 85% 20%, rgba(242,140,40,0.28), transparent 28%),
                linear-gradient(135deg, var(--c34-black), var(--c34-green));
            color: white;
            padding: 34px 20px 30px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.18);
        }

        header::after {
            content: "C34";
            position: absolute;
            right: 18px;
            bottom: -28px;
            font-size: 110px;
            font-weight: 900;
            letter-spacing: -8px;
            opacity: 0.06;
        }

        header h1 {
            position: relative;
            z-index: 1;
            margin: 0 0 8px;
            font-size: clamp(30px, 7vw, 48px);
            letter-spacing: -1px;
        }

        header p {
            position: relative;
            z-index: 1;
            margin: 0;
            opacity: 0.9;
            font-size: 14px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .location {
            text-align: center;
            padding: 13px;
            background: var(--c34-white);
            color: var(--c34-muted);
            font-size: 14px;
            border-bottom: 1px solid var(--c34-border);
        }

        main {
            max-width: 1050px;
            margin: auto;
            padding: 28px 18px 40px;
        }

        .menu-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 22px;
        }

        .menu-title h2 {
            margin: 0;
            color: var(--c34-black);
            font-size: clamp(24px, 5vw, 32px);
        }

        .menu-title h2::after {
            content: "";
            color: var(--c34-orange);
            font-size: 11px;
            letter-spacing: 1.5px;
            vertical-align: middle;
        }

        .cart {
            background: var(--c34-green);
            color: white;
            padding: 11px 16px;
            border-radius: 999px;
            font-weight: bold;
            box-shadow: 0 6px 16px rgba(31,122,77,0.22);
            white-space: nowrap;
        }

        #menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .item {
            position: relative;
            overflow: hidden;
            background: rgba(255,255,255,0.96);
            border: 1px solid var(--c34-border);
            border-radius: 18px;
            padding: 21px;
            box-shadow: var(--c34-shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .item::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--c34-green), var(--c34-orange));
        }

        .item:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 40px rgba(11,15,13,0.14);
        }

        .item h3 {
            margin: 4px 0 10px;
            color: var(--c34-black);
            font-size: 20px;
        }

        .description {
            color: var(--c34-muted);
            line-height: 1.55;
            min-height: 50px;
        }

        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }

        .price {
            color: var(--c34-green);
            font-weight: 900;
            font-size: 21px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 11px 16px;
            background: linear-gradient(135deg, var(--c34-green), var(--c34-green-light));
            color: white;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 6px 14px rgba(31,122,77,0.18);
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        button:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        #cartBox {
            display: none;
            background: var(--c34-white);
            margin-top: 30px;
            padding: 22px;
            border: 1px solid var(--c34-border);
            border-radius: 18px;
            box-shadow: var(--c34-shadow);
        }

        .cart-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid var(--c34-border);
        }

        .checkout-button {
            width: 100%;
            margin-top: 16px;
            padding: 15px;
            font-size: 16px;
            background: linear-gradient(135deg, var(--c34-orange), #e87510);
        }

        .error {
            background: #fff0ed;
            color: #a33b2b;
            padding: 15px;
            border: 1px solid #f1c9c1;
            border-radius: 12px;
        }

        footer {
            text-align: center;
            padding: 34px 15px;
            background: #090909;
            color: #c8c8c8;
        }

        footer::after { content: "CANNIBAL 34"; display: block; margin-top: 10px; color: #d4af37; font-weight: 900; letter-spacing: 3px; }\n\nfooter strong {
            color: white;
        }

        @media (max-width: 600px) {
            main {
                padding: 22px 14px 32px;
            }

            .menu-title {
                align-items: flex-start;
            }

            .menu-title h2::after {
                display: block;
                margin-top: 5px;
            }

            .cart {
                padding: 10px 13px;
            }

            #menu {
                grid-template-columns: 1fr;
            }

            .item {
                padding: 19px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🍽️ Paradise Food Hub</h1>
    <p>Good food. Simple ordering.</p>
</header>

<div class="location">
    📍 Ha Thamae, next to Shelly Brown, Maseru, Lesotho
</div>

<main>

    <div class="menu-title">
        <h2>Menu</h2>

        <div class="cart">
            Cart: <span id="cartCount">0</span>
        </div>
    </div>

    <div id="menu">
        Loading menu...
    </div>

    <div id="cartBox">

        <h2>Your Cart</h2>

        <div id="cartItems"></div>

        <h3>
            Total: M<span id="cartTotal">0.00</span>
        </h3>

        <button
            class="checkout-button"
            onclick="checkout()"
        >
            Proceed to Checkout
        </button>

    </div>

</main>

<footer>
    Paradise Food Hub © 2026
</footer>

<script>

let menu = [];
let cart = [];


async function loadMenu() {

    const container =
        document.getElementById("menu");

    try {

        const response =
            await fetch("/api/menu");

        if (!response.ok) {
            throw new Error(
                "Server returned " + response.status
            );
        }

        menu = await response.json();

        container.innerHTML = "";

        if (!menu.length) {
            container.innerHTML =
                "<p>No menu items available.</p>";
            return;
        }

        menu.forEach(item => {

            const card =
                document.createElement("div");

            card.className = "item";

            card.innerHTML = `
                <h3>${escapeHtml(item.name)}</h3>

                <div class="description">
                    ${escapeHtml(item.description || "")}
                </div>

                <div class="bottom">

                    <div class="price">
                        M${Number(item.price).toFixed(2)}
                    </div>

                    <button>
                        Add
                    </button>

                </div>
            `;

            card.querySelector("button")
                .addEventListener(
                    "click",
                    () => addToCart(item.id)
                );

            container.appendChild(card);
        });

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="error">
                Unable to load the menu.
                Please refresh the page.
            </div>
        `;
    }
}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function addToCart(id) {

    const item =
        menu.find(x => x.id === id);

    if (!item) {
        return;
    }

    const existing =
        cart.find(x => x.id === id);

    if (existing) {

        existing.quantity += 1;

    } else {

        cart.push({
            id: item.id,
            name: item.name,
            price: Number(item.price),
            quantity: 1
        });
    }

    updateCart();
}


function updateCart() {

    const cartItems =
        document.getElementById("cartItems");

    const cartBox =
        document.getElementById("cartBox");

    cartItems.innerHTML = "";

    let count = 0;
    let total = 0;

    cart.forEach(item => {

        count += item.quantity;

        total +=
            item.price * item.quantity;

        const row =
            document.createElement("div");

        row.className = "cart-row";

        row.innerHTML = `
            <span>
                ${escapeHtml(item.name)}
                × ${item.quantity}
            </span>

            <strong>
                M${(
                    item.price * item.quantity
                ).toFixed(2)}
            </strong>
        `;

        cartItems.appendChild(row);
    });

    document.getElementById(
        "cartCount"
    ).textContent = count;

    document.getElementById(
        "cartTotal"
    ).textContent = total.toFixed(2);

    cartBox.style.display =
        cart.length ? "block" : "none";
}


function checkout() {

    if (!cart.length) {

        alert("Your cart is empty.");

        return;
    }

    localStorage.setItem(
        "paradise_cart",
        JSON.stringify(
            cart.map(item => ({
                id: item.id,
                quantity: item.quantity
            }))
        )
    );

    window.location.href =
        "/checkout";
}


loadMenu();

</script>

</body>
</html>
