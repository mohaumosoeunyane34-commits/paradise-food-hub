<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paradise Food Hub - Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin: 6px 0 0;
            opacity: 0.8;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .order {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid #ddd;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .order-number {
            font-size: 20px;
            font-weight: bold;
        }

        .status {
            padding: 7px 12px;
            border-radius: 20px;
            background: #eee;
            font-weight: bold;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .detail {
            background: #f7f7f7;
            padding: 12px;
            border-radius: 8px;
        }

        .label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .value {
            font-weight: bold;
        }

        .items {
            margin-top: 15px;
        }

        .items div {
            padding: 7px 0;
            border-bottom: 1px solid #eee;
        }

        .total {
            font-size: 21px;
            font-weight: bold;
            margin-top: 15px;
        }

        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 7px;
            background: #111;
            color: white;
            cursor: pointer;
        }

        .controls {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .empty {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        .error {
            background: #ffe5e5;
            color: #a00000;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <h1>Paradise Food Hub</h1>
    <p>Admin Dashboard</p>
</header>

<div class="container">

    <div id="orders">
        Loading orders...
    </div>

</div>

<script>

async function loadOrders() {

    const container =
        document.getElementById("orders");

    try {

        const response =
            await fetch("/orders");

        const orders =
            await response.json();

        if (!response.ok) {

            throw new Error(
                orders.error || "Unable to load orders."
            );
        }

        if (!orders.length) {

            container.innerHTML =
                '<div class="empty">No orders yet.</div>';

            return;
        }

        container.innerHTML = "";

        for (const order of orders) {

            const card =
                document.createElement("div");

            card.className = "order";

            card.innerHTML = `

                <div class="order-header">

                    <div class="order-number">
                        Order #${order.id}
                    </div>

                    <div class="status">
                        ${order.status}
                    </div>

                </div>

                <div class="details">

                    <div class="detail">
                        <div class="label">Customer</div>
                        <div class="value">
                            ${escapeHtml(order.customer_name)}
                        </div>
                    </div>

                    <div class="detail">
                        <div class="label">Phone</div>
                        <div class="value">
                            ${escapeHtml(order.phone)}
                        </div>
                    </div>

                    <div class="detail">
                        <div class="label">Order Type</div>
                        <div class="value">
                            ${escapeHtml(order.order_type || "DELIVERY")}
                        </div>
                    </div>

                    <div class="detail">
                        <div class="label">Address</div>
                        <div class="value">
                            ${escapeHtml(order.address || "Pickup")}
                        </div>
                    </div>

                    <div class="detail">
                        <div class="label">Payment</div>
                        <div class="value">
                            ${escapeHtml(order.payment_method || "CASH")}
                        </div>
                    </div>

                    <div class="detail">
                        <div class="label">Payment Status</div>
                        <div class="value">
                            ${escapeHtml(order.payment_status || "UNPAID")}
                        </div>
                    </div>

                    <div class="detail">
                        <div class="label">Special Instructions</div>
                        <div class="value">
                            ${escapeHtml(order.notes || "None")}
                        </div>
                    </div>

                    <div class="detail">
                        <div class="label">Created</div>
                        <div class="value">
                            ${escapeHtml(order.created_at)}
                        </div>
                    </div>

                </div>

                <div class="total">
                    Total: M${Number(order.total).toFixed(2)}
                </div>

                <div class="controls">

                    <select
                        onchange="changeStatus(${order.id}, this.value)"
                    >

                        <option value="PENDING"
                            ${order.status === "PENDING" ? "selected" : ""}>
                            Pending
                        </option>

                        <option value="ACCEPTED"
                            ${order.status === "ACCEPTED" ? "selected" : ""}>
                            Accepted
                        </option>

                        <option value="PREPARING"
                            ${order.status === "PREPARING" ? "selected" : ""}>
                            Preparing
                        </option>

                        <option value="READY"
                            ${order.status === "READY" ? "selected" : ""}>
                            Ready
                        </option>

                        <option value="DELIVERED"
                            ${order.status === "DELIVERED" ? "selected" : ""}>
                            Delivered
                        </option>

                        <option value="CANCELLED"
                            ${order.status === "CANCELLED" ? "selected" : ""}>
                            Cancelled
                        </option>

                    </select>

                </div>

            `;

            container.appendChild(card);
        }

    } catch (error) {

        container.innerHTML =
            `<div class="error">
                ${escapeHtml(error.message)}
            </div>`;
    }
}


async function changeStatus(orderId, status) {

    try {

        const response =
            await fetch(
                `/api/orders/${orderId}/status`,
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        status: status
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to update order."
            );
        }

        loadOrders();

    } catch (error) {

        alert(error.message);

        loadOrders();
    }
}


function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value == null ? "" : String(value);

    return div.innerHTML;
}


loadOrders();

setInterval(loadOrders, 15000);

</script>

</body>
</html>
