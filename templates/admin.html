<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paradise Food Hub | Owner Dashboard</title>

    <style>
        :root {
            --green: #1f7a4d;
            --green-dark: #145c39;
            --orange: #f28c28;
            --cream: #fffaf0;
            --cream-dark: #f5ead5;
            --charcoal: #202522;
            --muted: #6b756f;
            --white: #ffffff;
            --border: #e8e2d7;
            --danger: #c94b4b;
            --shadow: 0 10px 30px rgba(31, 48, 39, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: var(--cream);
            color: var(--charcoal);
        }

        header {
            background: linear-gradient(135deg, var(--green-dark), var(--green));
            color: white;
            padding: 24px 20px;
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: var(--orange);
            display: grid;
            place-items: center;
            font-size: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        header p {
            margin: 4px 0 0;
            opacity: .82;
        }

        .refresh-btn {
            background: white;
            color: var(--green-dark);
            border: none;
            border-radius: 10px;
            padding: 11px 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 24px 20px 50px;
        }

        .welcome {
            margin-bottom: 22px;
        }

        .welcome h2 {
            margin: 0;
            font-size: 24px;
        }

        .welcome p {
            margin: 6px 0 0;
            color: var(--muted);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .stat-icon {
            font-size: 23px;
            margin-bottom: 10px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .stat-value {
            margin-top: 6px;
            font-size: 27px;
            font-weight: 800;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 21px;
        }

        .section-title span {
            color: var(--muted);
            font-size: 14px;
        }

        #orders {
            display: grid;
            gap: 18px;
        }

        .order {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding-bottom: 15px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .order-number {
            font-size: 19px;
            font-weight: 800;
        }

        .status {
            padding: 7px 12px;
            border-radius: 999px;
            background: #edf5ef;
            color: var(--green-dark);
            font-size: 12px;
            font-weight: 800;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .detail {
            background: #fcfaf5;
            border: 1px solid #eee7da;
            padding: 13px;
            border-radius: 12px;
        }

        .label {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .value {
            font-weight: 700;
            word-break: break-word;
        }

        .total {
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            color: var(--green-dark);
            font-size: 22px;
            font-weight: 900;
        }

        .controls {
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select {
            width: 100%;
            max-width: 260px;
            padding: 11px 13px;
            border: 1px solid #d9d2c5;
            border-radius: 10px;
            background: white;
            color: var(--charcoal);
            font-size: 14px;
            font-weight: 700;
        }

        .empty,
        .error {
            background: var(--white);
            padding: 40px 25px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .empty {
            color: var(--muted);
        }

        .error {
            color: var(--danger);
            border-color: #f0caca;
        }

        .footer-note {
            margin-top: 30px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        @media (max-width: 900px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .details {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 15px;
            }

            .container {
                padding: 20px 14px 40px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat {
                padding: 15px;
            }

            .stat-value {
                font-size: 22px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .order {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="brand">
            <div class="brand-icon">🍽️</div>
            <div>
                <h1>Paradise Food Hub</h1>
                <p>Owner Dashboard</p>
            </div>
        </div>

        <button class="refresh-btn" onclick="loadOrders()">
            ↻ Refresh Orders
        </button>
    </div>
</header>

<main class="container">

    <div class="welcome">
        <h2>Good day, Owner 👋</h2>
        <p>Manage incoming orders and keep your kitchen moving.</p>
    </div>

    <section class="stats">
        <div class="stat">
            <div class="stat-icon">📦</div>
            <div class="stat-label">Total Orders</div>
            <div class="stat-value" id="totalOrders">0</div>
        </div>

        <div class="stat">
            <div class="stat-icon">⏳</div>
            <div class="stat-label">Pending</div>
            <div class="stat-value" id="pendingOrders">0</div>
        </div>

        <div class="stat">
            <div class="stat-icon">🔥</div>
            <div class="stat-label">Preparing</div>
            <div class="stat-value" id="preparingOrders">0</div>
        </div>

        <div class="stat">
            <div class="stat-icon">💰</div>
            <div class="stat-label">Order Value</div>
            <div class="stat-value" id="totalRevenue">M0.00</div>
        </div>
    </section>

    <div class="section-title">
        <h2>Recent Orders</h2>
        <span id="orderCount">0 orders</span>
    </div>

    <div id="orders">
        <div class="empty">Loading orders...</div>
    </div>

    <div class="footer-note">
        Paradise Food Hub • Fresh food. Simple ordering.
    </div>

</main>

<script>

async function loadOrders() {

    const container = document.getElementById("orders");

    try {

        const response = await fetch("/orders");
        const orders = await response.json();

        if (!response.ok) {
            throw new Error(
                orders.error || "Unable to load orders."
            );
        }

        updateStats(orders);

        if (!orders.length) {
            container.innerHTML =
                '<div class="empty">🍽️ No orders yet. New orders will appear here.</div>';
            return;
        }

        container.innerHTML = "";

        for (const order of orders) {

            const card = document.createElement("div");
            card.className = "order";

            card.innerHTML = `
                <div class="order-header">
                    <div class="order-number">
                        Order #${order.id}
                    </div>

                    <div class="status">
                        ${escapeHtml(order.status)}
                    </div>
                </div>

                <div class="details">

                    <div class="detail">
                        <div class="label">Customer</div>
                        <div class="value">
                            ${escapeHtml(order.customer_name)}
                        </div>
                    </div>

                    <div class="detail">
                        <div class="label">Phone</div>
                        <div class="value">
                            ${escapeHtml(order.phone)}
                        </div>
                    </div>

                    <div class="detail">
                        <div class="label">Order Type</div>
                        <div class="value">
                            ${escapeHtml(order.order_type || "DELIVERY")}
                        </div>
                    </div>

                    <div class="detail">
                        <div class="label">Address</div>
                        <div class="value">
                            ${escapeHtml(order.address || "Pickup")}
                        </div>
                    </div>

                    <div class="detail">
                        <div class="label">Payment</div>
                        <div class="value">
                            ${escapeHtml(order.payment_method || "CASH")}
                        </div>
                    </div>

                    <div class="detail">
                        <div class="label">Payment Status</div>
                        <div class="value">
                            ${escapeHtml(order.payment_status || "UNPAID")}
                        </div>
                    </div>

                    <div class="detail">
                        <div class="label">Special Instructions</div>
                        <div class="value">
                            ${escapeHtml(order.notes || "None")}
                        </div>
                    </div>

                    <div class="detail">
                        <div class="label">Created</div>
                        <div class="value">
                            ${escapeHtml(order.created_at)}
                        </div>
                    </div>

                </div>

                <div class="total">
                    Total: M${Number(order.total).toFixed(2)}
                </div>

                <div class="controls">

                    <select
                        onchange="changeStatus(${order.id}, this.value)"
                        aria-label="Change order status"
                    >
                        <option value="PENDING"
                            ${order.status === "PENDING" ? "selected" : ""}>
                            Pending
                        </option>

                        <option value="ACCEPTED"
                            ${order.status === "ACCEPTED" ? "selected" : ""}>
                            Accepted
                        </option>

                        <option value="PREPARING"
                            ${order.status === "PREPARING" ? "selected" : ""}>
                            Preparing
                        </option>

                        <option value="READY"
                            ${order.status === "READY" ? "selected" : ""}>
                            Ready
                        </option>

                        <option value="DELIVERED"
                            ${order.status === "DELIVERED" ? "selected" : ""}>
                            Delivered
                        </option>

                        <option value="CANCELLED"
                            ${order.status === "CANCELLED" ? "selected" : ""}>
                            Cancelled
                        </option>
                    </select>

                </div>
            `;

            container.appendChild(card);
        }

    } catch (error) {

        container.innerHTML =
            `<div class="error">
                ${escapeHtml(error.message)}
            </div>`;
    }
}

function updateStats(orders) {

    const total =
        orders.reduce(
            (sum, order) => sum + Number(order.total || 0),
            0
        );

    const pending =
        orders.filter(
            order => order.status === "PENDING"
        ).length;

    const preparing =
        orders.filter(
            order => order.status === "PREPARING"
        ).length;

    document.getElementById("totalOrders").textContent =
        orders.length;

    document.getElementById("pendingOrders").textContent =
        pending;

    document.getElementById("preparingOrders").textContent =
        preparing;

    document.getElementById("totalRevenue").textContent =
        `M${total.toFixed(2)}`;

    document.getElementById("orderCount").textContent =
        `${orders.length} ${orders.length === 1 ? "order" : "orders"}`;
}

async function changeStatus(orderId, status) {

    try {

        const response = await fetch(
            `/api/orders/${orderId}/status`,
            {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    status: status
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Unable to update order."
            );
        }

        await loadOrders();

    } catch (error) {

        alert(error.message);
        await loadOrders();
    }
}

function escapeHtml(value) {

    const div = document.createElement("div");

    div.textContent =
        value == null ? "" : String(value);

    return div.innerHTML;
}

loadOrders();

setInterval(loadOrders, 15000);

</script>

</body>
</html>
