<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paradise Food Hub - Checkout</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        .location {
            background: #fff4d6;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        .summary {
            background: #f7f7f7;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        .error {
            color: #b00020;
            margin-top: 15px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Paradise Food Hub</h1>

    <div class="location">
        📍 <strong>Find us:</strong><br>
        Ha Thamae, next to Shelly Brown, Maseru
    </div>

    <h2>Checkout</h2>

    <div class="summary">
        <h3>Your Order</h3>
        <div id="order-items">Loading order...</div>
        <div class="total">
            Total: M<span id="total">0.00</span>
        </div>
    </div>

    <form id="checkout-form">

        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            required
            placeholder="Enter your full name"
        >

        <label for="phone">Phone Number</label>
        <input
            type="tel"
            id="phone"
            required
            placeholder="+266..."
        >

        <label for="order-type">Order Type</label>
        <select id="order-type" required>
            <option value="DELIVERY">Delivery</option>
            <option value="PICKUP">Pickup</option>
        </select>

        <div id="address-section">

            <label for="address">Delivery Address</label>

            <textarea
                id="address"
                placeholder="Enter your delivery address"
            ></textarea>

        </div>

        <label for="notes">Special Instructions</label>

        <textarea
            id="notes"
            placeholder="Example: No onions, extra sauce..."
        ></textarea>

        <label for="payment-method">Payment Method</label>

        <select id="payment-method" required>
            <option value="CASH">Cash</option>
            <option value="MOPAY">MoPay</option>
        </select>

        <button type="submit" id="place-order">
            Place Order
        </button>

        <div id="error" class="error"></div>

    </form>

</div>

<script>

const cart = JSON.parse(
    localStorage.getItem("paradise_cart") || "[]"
);

const orderItems = document.getElementById("order-items");
const totalElement = document.getElementById("total");
const orderType = document.getElementById("order-type");
const addressSection = document.getElementById("address-section");
const address = document.getElementById("address");
const form = document.getElementById("checkout-form");
const errorElement = document.getElementById("error");
const button = document.getElementById("place-order");


function updateAddressVisibility() {

    if (orderType.value === "PICKUP") {

        addressSection.classList.add("hidden");
        address.required = false;

    } else {

        addressSection.classList.remove("hidden");
        address.required = true;

    }
}


orderType.addEventListener(
    "change",
    updateAddressVisibility
);

updateAddressVisibility();


async function loadOrder() {

    if (!cart.length) {

        orderItems.innerHTML =
            "<p>Your cart is empty.</p>";

        totalElement.textContent = "0.00";

        button.disabled = true;

        return;
    }

    try {

        const response = await fetch(
            "/api/order-preview",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    items: cart
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.error || "Unable to load order."
            );

        }

        orderItems.innerHTML = "";

        data.items.forEach(item => {

            const row = document.createElement("div");

            row.textContent =
                `${item.name} × ${item.quantity} — M${Number(item.subtotal).toFixed(2)}`;

            orderItems.appendChild(row);

        });

        totalElement.textContent =
            Number(data.total).toFixed(2);

    } catch (error) {

        errorElement.textContent =
            error.message;

        button.disabled = true;
    }
}


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    errorElement.textContent = "";

    button.disabled = true;
    button.textContent = "Placing Order...";

    const payload = {

        customer_name:
            document.getElementById("name").value.trim(),

        phone:
            document.getElementById("phone").value.trim(),

        order_type:
            orderType.value,

        address:
            address.value.trim(),

        notes:
            document.getElementById("notes").value.trim(),

        payment_method:
            document.getElementById("payment-method").value,

        items: cart
    };


    try {

        const response = await fetch(
            "/api/orders",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(payload)
            }
        );

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.error || "Unable to place order."
            );

        }

        localStorage.removeItem(
            "paradise_cart"
        );

        window.location.href =
            "/receipt/" + data.order_id;

    } catch (error) {

        errorElement.textContent =
            error.message;

        button.disabled = false;
        button.textContent = "Place Order";
    }

});


loadOrder();

</script>

</body>
</html>
