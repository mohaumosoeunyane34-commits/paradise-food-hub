<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paradise Food Hub — Receipt</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .receipt {
            max-width: 520px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
        }

        .brand {
            text-align: center;
            border-bottom: 2px dashed #ddd;
            padding-bottom: 18px;
        }

        .brand h1 {
            margin: 0;
            font-size: 28px;
        }

        .brand p {
            margin: 6px 0 0;
            color: #777;
        }

        .order-number {
            text-align: center;
            margin: 20px 0;
            font-size: 20px;
            font-weight: bold;
        }

        .details {
            background: #f7f7f7;
            padding: 15px;
            border-radius: 10px;
            line-height: 1.7;
        }

        .details strong {
            display: inline-block;
            min-width: 75px;
        }

        .status {
            text-align: center;
            margin: 20px 0;
            padding: 12px;
            border-radius: 10px;
            background: #eee;
            font-weight: bold;
        }

        .items {
            margin-top: 20px;
        }

        .item {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .item-name {
            font-weight: bold;
        }

        .item-meta {
            color: #777;
            font-size: 13px;
            margin-top: 3px;
        }

        .item-price {
            font-weight: bold;
        }

        .total {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 2px solid #222;
            font-size: 22px;
            font-weight: bold;
        }

        .date {
            text-align: center;
            color: #777;
            margin-top: 18px;
            font-size: 13px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .buttons a,
        .buttons button {
            flex: 1;
            padding: 13px;
            border-radius: 9px;
            border: none;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .menu-button {
            background: #111;
            color: white;
        }

        .print-button {
            background: #eee;
            color: #111;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 18px;
            border-top: 2px dashed #ddd;
            color: #777;
            font-size: 13px;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .receipt {
                box-shadow: none;
                max-width: none;
            }

            .buttons {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="receipt">

    <div class="brand">
        <h1>🍽️ Paradise Food Hub</h1>
        <p>Good food. Simple ordering.</p>
    </div>

    <div id="receipt">
        Loading receipt...
    </div>

</div>

<script>

const pathParts =
    window.location.pathname.split("/");

const orderId =
    pathParts[pathParts.length - 1];


async function loadReceipt() {

    try {

        const response =
            await fetch(`/api/orders/${orderId}`);

        const data =
            await response.json();

        if (!response.ok || data.error) {

            document.getElementById("receipt").innerHTML = `
                <p style="text-align:center;">
                    ${data.error || "Unable to load receipt."}
                </p>
            `;

            return;
        }

        const order = data.order;
        const items = data.items;

        let itemsHTML = "";

        items.forEach(item => {

            itemsHTML += `
                <div class="item">

                    <div>
                        <div class="item-name">
                            ${item.name}
                        </div>

                        <div class="item-meta">
                            ${item.quantity} × M${Number(item.price).toFixed(2)}
                        </div>
                    </div>

                    <div class="item-price">
                        M${Number(item.subtotal).toFixed(2)}
                    </div>

                </div>
            `;
        });

        document.getElementById("receipt").innerHTML = `

            <div class="order-number">
                Order #${order.id}
            </div>

            <div class="details">

                <div>
                    <strong>Customer:</strong>
                    ${order.customer_name}
                </div>

                <div>
                    <strong>Phone:</strong>
                    ${order.phone}
                </div>

                <div>
                    <strong>Address:</strong>
                    ${order.address}
                </div>

            </div>

            <div class="status">
                STATUS: ${order.status}
            </div>

            <div class="items">
                ${itemsHTML}
            </div>

            <div class="total">
                <span>Total</span>
                <span>M${Number(order.total).toFixed(2)}</span>
            </div>

            <div class="date">
                Order placed: ${order.created_at}
            </div>

            <div class="buttons">

                <a class="menu-button" href="/">
                    ← Menu
                </a>

                <button class="print-button"
                        onclick="window.print()">
                    🖨️ Print
                </button>

            </div>

            <div class="footer">
                Thank you for ordering from Paradise Food Hub ❤️
            </div>
        `;

    } catch (error) {

        document.getElementById("receipt").innerHTML = `
            <p style="text-align:center;">
                Unable to connect to Paradise Food Hub.
            </p>
        `;
    }
}


loadReceipt();

</script>

</body>
</html>
