<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paradise Food Hub - Order Confirmation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .success {
            text-align: center;
            font-size: 45px;
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
        }

        .order-number {
            background: #111;
            color: white;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        .order-number small {
            display: block;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .order-number strong {
            font-size: 25px;
        }

        .info {
            background: #f7f7f7;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            color: #666;
        }

        .value {
            font-weight: bold;
            text-align: right;
        }

        .items {
            margin-top: 20px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .total {
            font-size: 23px;
            font-weight: bold;
            text-align: right;
            margin-top: 18px;
        }

        .location {
            background: #fff4d6;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button,
        a {
            flex: 1;
            padding: 13px;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        button {
            border: none;
            background: #111;
            color: white;
        }

        a {
            background: #eee;
            color: #222;
        }

        .error {
            text-align: center;
            color: #b00020;
            padding: 20px;
        }

        @media (max-width: 500px) {

            .buttons {
                flex-direction: column;
            }

            .row {
                flex-direction: column;
                gap: 3px;
            }

            .value {
                text-align: left;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card" id="receipt">

        <div class="success">✅</div>

        <h1>Order Received!</h1>

        <p class="subtitle">
            Thank you for ordering from Paradise Food Hub.
        </p>

        <div id="content">
            Loading order...
        </div>

    </div>

</div>

<script>

const orderId =
    window.location.pathname.split("/").pop();


async function loadOrder() {

    const content =
        document.getElementById("content");

    try {

        const response =
            await fetch(`/api/orders/${orderId}`);

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error || "Order not found."
            );
        }

        const order =
            data.order;

        const items =
            data.items || [];


        let itemsHtml = "";

        items.forEach(item => {

            itemsHtml += `
                <div class="item">

                    <span>
                        ${escapeHtml(item.name)}
                        × ${item.quantity}
                    </span>

                    <strong>
                        M${Number(item.subtotal).toFixed(2)}
                    </strong>

                </div>
            `;

        });


        content.innerHTML = `

            <div class="order-number">

                <small>ORDER NUMBER</small>

                <strong>#${order.id}</strong>

            </div>


            <div class="info">

                <div class="row">
                    <span class="label">
                        Customer
                    </span>

                    <span class="value">
                        ${escapeHtml(order.customer_name)}
                    </span>
                </div>


                <div class="row">
                    <span class="label">
                        Phone
                    </span>

                    <span class="value">
                        ${escapeHtml(order.phone)}
                    </span>
                </div>


                <div class="row">
                    <span class="label">
                        Order Type
                    </span>

                    <span class="value">
                        ${escapeHtml(order.order_type || "DELIVERY")}
                    </span>
                </div>


                <div class="row">
                    <span class="label">
                        Address
                    </span>

                    <span class="value">
                        ${escapeHtml(order.address || "Pickup")}
                    </span>
                </div>


                <div class="row">
                    <span class="label">
                        Payment
                    </span>

                    <span class="value">
                        ${escapeHtml(order.payment_method || "CASH")}
                    </span>
                </div>


                <div class="row">
                    <span class="label">
                        Payment Status
                    </span>

                    <span class="value">
                        ${escapeHtml(order.payment_status || "UNPAID")}
                    </span>
                </div>


                <div class="row">
                    <span class="label">
                        Order Status
                    </span>

                    <span class="value">
                        ${escapeHtml(order.status)}
                    </span>
                </div>

            </div>


            <div class="items">

                <h2>Order Items</h2>

                ${itemsHtml}

                <div class="total">
                    Total: M${Number(order.total).toFixed(2)}
                </div>

            </div>


            <div class="location">

                📍 <strong>Paradise Food Hub</strong>

                <br><br>

                Ha Thamae, next to Shelly Brown,
                Maseru, Lesotho

            </div>


            <div class="buttons">

                <button onclick="window.print()">
                    Print Receipt
                </button>

                <a href="/">
                    Back to Menu
                </a>

            </div>

        `;

    } catch (error) {

        content.innerHTML = `
            <div class="error">
                ${escapeHtml(error.message)}
            </div>
        `;

    }

}


function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value == null ? "" : String(value);

    return div.innerHTML;
}


loadOrder();

</script>

</body>
</html>
