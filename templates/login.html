<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paradise Food Hub — Admin Login</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 90%;
            max-width: 380px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: 0;
            border-radius: 8px;
            background: #111;
            color: white;
            font-weight: bold;
        }

        .error {
            color: #b00020;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>Paradise Food Hub</h1>
        <p style="text-align:center;">Admin Login</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">LOGIN</button>
        </form>
    </div>
</body>
</html>
